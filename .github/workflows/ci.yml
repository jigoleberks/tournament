name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    # Same-repo branches already get a push run; the duplicate pull_request run
    # doubles CI minutes and was the half that kept wedging. Fork PRs have no
    # push run, so they still need this.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v7
      # A mirror that accepts the connection and then never sends data will hang
      # apt forever -- apt has no read timeout by default. These options turn
      # that silent stall into a retry and then a real error.
      - name: Install libvips
        env:
          APT_OPTS: -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install --no-install-recommends -y libvips42 libheif-plugin-libde265
      - uses: ruby/setup-ruby@v1
        with: { bundler-cache: true }
      - run: bin/rails db:test:prepare
      - run: bin/rails test
      - run: bin/rails test:system
